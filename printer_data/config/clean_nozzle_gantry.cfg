[gcode_macro _CLEAN_NOZZLE_GANTRY]
gcode:
   SAVE_GCODE_STATE NAME=clean_nozzle_gantry
   G90
   G1 X30 F18000   #Adjust the X value position to be the X position left most of the brush, without touching it and without touching the nozzle parking spot/seal either.
   G1 X70 F18000   #Adjust the X value position to be the X position right most of the brush, without touching it.
   G1 Y349 F18000  #Adjust the Y355 position to be the middle of the brush 
   G1 X30 F18000
   G1 X70 F18000   
   RESTORE_GCODE_STATE NAME=clean_nozzle_gantry





# You can find your values by homing X & Y then using mainsail to place the toolhead at the left most side of the brush 
# and right most side of the brush. Adjust Y to be in the middle or as close to the middle as possible.

# Then update the below variables in the mmu_macro_vars.cfg as below. 

# ATTENTION: While the nozzle stop can withstand sustained heat of 287C (subject to the RTV used) 
# it is recommended to set the variable_enable_park_runout to false as you don't want to park the nozzle 
# on the seal and wait for extended periods of time to prevent it from melting.




# [gcode_macro _MMU_SEQUENCE_VARS]

# variable_enable_park_printing   : 'toolchange,load,unload,runout,pause,cancel'
# variable_enable_park_standalone : 'toolchange,load,unload,pause,cancel'
# variable_enable_park_disabled   : 'pause,cancel'


# variable_park_toolchange        : 24.5, 349, 1, 5, 2
# variable_park_runout            : 24.5, 349, 5, 10, 2
# variable_park_pause             : 24.5, 349, 5, 10, 2
# variable_park_cancel            : 24.5, 349, 10, 5, 5

# variable_post_form_tip_position : 24.5, 349, 0

# variable_user_post_load_extension     : ' _CLEAN_NOZZLE_GANTRY'

#####################################################################
#   Heat-resistant pad (left of the brush) — used by the Demon print-start hooks
#####################################################################
# The pad's left edge is bevelled; every other side can catch the nozzle. Always enter
# from the left: back off the brush row to approach_y, go to approach_x, move to pad_y,
# then slide right onto the pad. Leave the same way in reverse. The brush and pad ride on
# the gantry, so only X/Y matter. Positions jogged by Pato 2026-11-06.

[gcode_macro _PARK_ON_PAD]
description: Park the nozzle on the heat-resistant pad, entering over its bevelled left edge
variable_pad_x: 24.0
variable_pad_y: 348.0
variable_approach_x: 15.0
variable_approach_y: 340.0
variable_exit_right_dx: 7.0     # first exit (to BED_CHECKER): slide this far right off the pad first
gcode:
  _GO_TO_PAD_APPROACH
  G0 Y{pad_y} F6000
  G0 X{pad_x} F3000
  M400

[gcode_macro _LEAVE_PAD]
description: Back the nozzle off the pad to the left, then forward to the approach point
gcode:
  {% set pad = printer["gcode_macro _PARK_ON_PAD"] %}
  G90
  G0 X{pad.approach_x} F3000
  G0 Y{pad.approach_y} F6000
  M400

[gcode_macro _GO_TO_PAD_APPROACH]
description: From anywhere (e.g. over the brush), go to the pad approach point
gcode:
  {% set pad = printer["gcode_macro _PARK_ON_PAD"] %}
  G90
  {% if printer.toolhead.position.z < 10 %}
    G0 Z10 F1200
  {% endif %}
  G0 Y{pad.approach_y} F12000
  G0 X{pad.approach_x} F12000
  M400

[gcode_macro _PAD_EXIT_RIGHT]
description: If the nozzle is on the pad, slide exit_right_dx to the right, off the pad
gcode:
  {% set pad = printer["gcode_macro _PARK_ON_PAD"] %}
  {% set pos = printer.toolhead.position %}
  {% if (pos.x - pad.pad_x)|abs < 1.0 and (pos.y - pad.pad_y)|abs < 1.0 %}
    G90
    G0 X{pad.pad_x + pad.exit_right_dx} F3000
    M400
  {% endif %}

# OVERRIDE of Demon's _BC_MOVE (demon_bed_checker_heat_soak_v2.2.3.cfg). This file is included
# after the Demon dirs, so this definition wins. _BC_MOVE is BED_CHECKER's move to its probe
# point; the first call comes straight off the pad after the bed-temp wait, and Pato wants that
# to slide right first instead of leaving diagonally from mid-pad (2026-11-06). The two lines
# after _PAD_EXIT_RIGHT are Demon's original, unchanged. If a Demon update changes _BC_MOVE,
# re-copy its body here.
[gcode_macro _BC_MOVE]
gcode:
  {% set core_vars = printer["gcode_macro _CORE_VARS"] %}
  {% set bc_vars = printer["gcode_macro _BED_CHECKER_VARS"] %}
    _PAD_EXIT_RIGHT
    G90
    G0 X{bc_vars.nozzle_position_x|float} Y{bc_vars.nozzle_position_y|float} Z{core_vars.z_park|float} F9000
    M400

#####################################################################
#   Cold dry run of the print-start nozzle path (2026-11-06)
#####################################################################
# Replays the moves a print start makes around the brush and pad, without heating or
# extruding: wipe (Demon's own _step_control random passes), hold on the pad (bed wait),
# diagonal exit to the BED_CHECKER point, second wipe (after QGL), hold on the pad (cool to
# 150c), leave the pad and go to bed centre (contact calibration). Uses the live Demon
# cleaner variables, so it follows any change to them. Travel stays at Z10 (Demon's z_park);
# the real contact step drops to Z5 at centre, which is skipped here.
#   TEST_CLEAN_CYCLE                     full speed, 39 passes, 5 s holds (like a print)
#   TEST_CLEAN_CYCLE SPEED=50 PASSES=10  half speed, short wipes (first check after a change)
#   HOLD=<seconds> on the pad

[gcode_macro TEST_CLEAN_CYCLE]
description: Cold dry run of the print-start brush/pad path. HOLD=s PASSES=n SPEED=%
gcode:
  {% set clean = printer["gcode_macro _CLEAN_VARIABLES"] %}
  {% set start = printer["gcode_macro _START_VARIABLES"] %}
  {% set core = printer["gcode_macro _CORE_VARS"] %}
  {% set hold_ms = (params.HOLD|default(5)|float * 1000)|int %}
  {% set passes = params.PASSES|default(clean.pass_count - 1)|int %}
  {% set speed = params.SPEED|default(100)|int %}
  {% set bc_x = start.check_ref_point_x|float - printer.configfile.settings.beacon.x_offset|float %}
  {% set bc_y = start.check_ref_point_y|float - printer.configfile.settings.beacon.y_offset|float %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("TEST_CLEAN_CYCLE: not while a print is running")}
  {% elif printer.toolhead.homed_axes != 'xyz' %}
    {action_raise_error("TEST_CLEAN_CYCLE: home the printer first")}
  {% endif %}
  SAVE_GCODE_STATE NAME=test_clean_cycle
  M220 S{speed}
  G90
  {% if printer.toolhead.position.z < clean.min_travel_to_clean_z %}
    G0 Z{clean.min_travel_to_clean_z} F1200
  {% endif %}

  _TCC_MSG MSG="1/6 First clean ({passes} passes)"
  G0 X{clean.start_x} Y{clean.start_y} F{clean.clean_travel_speed * 60}
  G0 Z{clean.start_z} F4000
  {% for i in range(passes) %}
    _step_control
  {% endfor %}
  G0 Z{clean.park_z} F4000

  _TCC_MSG MSG="2/6 On the pad: bed heat wait ({hold_ms / 1000} s)"
  _PARK_ON_PAD
  G4 P{hold_ms}

  _TCC_MSG MSG="3/6 Exit right off the pad, then to BED_CHECKER point X{bc_x} Y{bc_y}"
  # Same values Demon's _BC_POS_SET sets at print start (recomputed every print), then the
  # real _BC_MOVE, so this tests the exact move a print makes.
  SET_GCODE_VARIABLE MACRO=_BED_CHECKER_VARS VARIABLE=nozzle_position_x VALUE={bc_x}
  SET_GCODE_VARIABLE MACRO=_BED_CHECKER_VARS VARIABLE=nozzle_position_y VALUE={bc_y}
  _BC_MOVE
  G4 P1000

  _TCC_MSG MSG="4/6 Second clean, after QGL ({passes} passes)"
  G0 X{clean.start_x} Y{clean.start_y} F{clean.clean_travel_speed * 60}
  G0 Z{clean.start_z} F4000
  {% for i in range(passes) %}
    _step_control
  {% endfor %}
  G0 Z{clean.park_z} F4000

  _TCC_MSG MSG="5/6 On the pad: cool to 150c wait ({hold_ms / 1000} s)"
  _PARK_ON_PAD
  G4 P{hold_ms}

  _TCC_MSG MSG="6/6 Leave the pad, go to bed centre"
  _LEAVE_PAD
  G0 X175 Y175 F9000
  M400

  RESTORE_GCODE_STATE NAME=test_clean_cycle
  _TCC_MSG MSG="TEST_CLEAN_CYCLE done"

[gcode_macro _TCC_MSG]
gcode:
  M117 {params.MSG}
  RESPOND MSG="TEST_CLEAN_CYCLE {params.MSG}"
